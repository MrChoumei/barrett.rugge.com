backend:
  name: github
  repo: MrChoumei/barrett.rugge.com
  branch: main
  base_url: https://barrett.rugge.com/
  auth_endpoint: api/auth

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Articles"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "toml-frontmatter"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Publication Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"

      - label: "Description"
        name: "description"
        widget: "text"
        required: false

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: true

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false

      - label: "Article"
        name: "body"
        widget: "markdown"
